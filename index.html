<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Luyện Tập</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Quiz Luyện Tập</h1>
      <div class="controls">
        <select id="set-select" aria-label="Chọn bộ câu hỏi"></select>
        <input
          id="set-file"
          type="text"
          placeholder="Nhập đường dẫn file (ví dụ ./data/questions.txt)"
        />
        <button id="btn-load">Tải</button>
        <span
          id="load-status"
          aria-live="polite"
          style="margin-left: 8px; color: #c33"
        ></span>
        <input id="search" type="search" placeholder="Tìm câu hỏi..." />
        <input id="jump" type="number" min="1" placeholder="Tới câu số..." />
        <button id="btn-go">Go</button>
      </div>
    </header>

    <main class="layout">
      <section class="question-panel">
        <div class="nav">
          <button id="prev">← Trước</button>
          <div id="meta"></div>
          <button id="next">Sau →</button>
        </div>

        <article id="question"></article>

        <div class="actions">
          <button id="submit">Nộp câu này</button>
          <button id="retry" class="secondary">Làm lại câu này</button>
        </div>

        <div id="feedback"></div>
      </section>

      <aside class="list-panel">
        <h2>Danh sách câu hỏi</h2>
        <div id="list"></div>
        <div class="pager">
          <button id="pg-prev">«</button>
          <span id="pg-info"></span>
          <button id="pg-next">»</button>
        </div>
      </aside>
    </main>

    <footer class="foot">
      <small
        >Deploy trên GitHub Pages. Dữ liệu:
        <code>data/questions.txt</code></small
      >
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
